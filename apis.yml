apis:
- name: FastShip Open API
  description: 'The versioned REST API behind FastShip, Cloud Commerce''s cross-border
    e-commerce logistics platform. Discovered live at openapi.fastship.co: GET /api/v2
    returns "Welcome to API Version 2.0" and POST /api/v2/login exchanges an email and
    password for a token. The surface is a Laravel application that returns a custom
    {message, description, data} JSON envelope and X-RateLimit-* headers. FastShip
    markets API integration to business accounts, but no public reference, OpenAPI or
    SDK is published, so the operation set beyond the login endpoint is not
    establishable without credentials.'
