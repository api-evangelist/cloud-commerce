description: 'Cloud Commerce (CloudCommerce) is a Bangkok, Thailand-based venture
  tech builder helping small and medium enterprises across Southeast Asia sell globally.
  Backed by 500 Global (500 Startups) at the seed stage, it operates three commerce
  platforms: FastShip, a cross-border e-commerce logistics platform; CloudMall, an
  e-commerce distribution platform to build, run, and scale online marketplaces; and
  KOLLAB, an influencer-commerce platform connecting brands with over 100,000 KOLs
  across Instagram, TikTok, and Facebook. The company connects SME product data to
  global online marketplaces and logistics providers. No public developer/API surface
  was found during enrichment (no docs, OpenAPI, or /.well-known discovery endpoints).'
