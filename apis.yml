name: Cloud Commerce
description: 'Cloud Commerce (CloudCommerce) is a Bangkok, Thailand-based venture tech
  builder helping small and medium enterprises across Southeast Asia sell globally.
  Backed by 500 Global (500 Startups) at the seed stage, it operates three commerce
  platforms: FastShip, a cross-border e-commerce logistics platform; CloudMall, an
  e-commerce distribution platform to build, run, and scale online marketplaces; and
  KOLLAB, an influencer-commerce platform connecting brands with over 100,000 KOLs
  across Instagram, TikTok, and Facebook. The company connects SME product data to
  global online marketplaces and logistics providers. FastShip runs a live versioned
  REST API at openapi.fastship.co and markets API integration to business accounts,
  but publishes no developer reference, no OpenAPI, and no SDKs: the documentation
  host docs.fastship.co accepts no connections and fastship.co/api is a one-paragraph
  marketing page. FastShip does serve a hand-authored llms.txt and a Pulsetic-hosted
  status page.'
