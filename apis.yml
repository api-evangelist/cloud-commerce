x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    FastShip's API is live and answers anonymously at openapi.fastship.co/api/v2, but the
    only public route to it is a lead-capture form: fastship.co/api is a one-paragraph
    WordPress portfolio page titled "API & Widget", the documentation host
    docs.fastship.co resolves to 13.251.14.8 and then accepts no TCP connection, and the
    "FastShip For Business" page that markets API integration ends in a registration form
    with no reference, no spec and no pricing behind it.
